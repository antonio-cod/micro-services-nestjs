services:
  products-db:
    image: postgres:15
    container_name: marketplace-products-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5434:5432'
    volumes:
      - products_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d products_db']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  products_db_data:

